<!DOCTYPE html>
<html lang="en" data-theme="light" data-accent="indigo" data-density="comfortable">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TaskFlow — a premium personal task and productivity workspace.">
  <meta name="theme-color" content="#f7f8fa">
  <title>TaskFlow</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- Apply saved theme before first paint to avoid a flash of the wrong theme -->
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('taskflow:settings') || '{}') || {};
        var theme = s.theme || 'system';
        if (theme === 'system') theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        var root = document.documentElement;
        root.setAttribute('data-theme', theme);
        if (s.accent) root.setAttribute('data-accent', s.accent);
        if (s.density) root.setAttribute('data-density', s.density);
      } catch (e) { /* fall back to defaults */ }
    })();
  </script>
</head>
<body>
  <div id="root">
    <div class="app-loader" aria-hidden="true">
      <div class="loader-logo"><img src="/logo.svg" alt="" width="44" height="44"></div>
      <div class="loader-bar"><span></span></div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
